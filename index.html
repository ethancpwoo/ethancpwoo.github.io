<!DOCTYPE html>
<html lang="en">
<head>

<body>
    <div class="load-screen" role="status" aria-live="polite" aria-label="Loading portfolio images">
        <div class="load-content">
            <span class="load-name">Ethan Woo</span>
            <div class="load-track" aria-hidden="true"><div class="load-fill"></div></div>

        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 18h6M10 21h4M8.5 14.5a6 6 0 1 1 7 0c-1 .7-1.5 1.6-1.5 3.5h-4c0-1.9-.5-2.8-1.5-3.5Z"/>

            <div class="contact-links">
                <a href="documents/ethanwooresume.pdf">Resume</a>
                <a href="mailto:ecpwoo@uwaterloo.ca">Email</a>
                <a href="https://github.com/ethancpwoo">GitHub</a>
                <a href="https://linkedin.com/in/ethancpwoo">LinkedIn</a>
            </div>
        </section>
        <div class="work-columns">
            <section aria-labelledby="experience-title">
                <h2 id="experience-title">Experience</h2>
                <div class="work-list"><button class="work-item" type="button" data-entry="7" aria-haspopup="dialog"><img class="company-logo" src="images/syncere/syncere-mark.png" alt=""><span class="card-title" title="Syncere">Syncere</span><span class="card-date">Jan 2026 – Sep 2026</span><span class="open-icon" aria-hidden="true">↗</span></button>
<button class="work-item" type="button" data-entry="0" aria-haspopup="dialog"><img class="company-logo" src="images/arenax/arenax-mark.png?v=3" alt=""><span class="card-title" title="ArenaX Labs">ArenaX Labs</span><span class="card-date">Jan 2025 – Sep 2025</span><span class="open-icon" aria-hidden="true">↗</span></button>

<button class="work-item" type="button" data-entry="2" aria-haspopup="dialog"><img class="company-logo" src="images/aes/aes-mark.png?v=2" alt=""><span class="card-title" title="Advanced Electrophoresis Solutions">AES</span><span class="card-date">May 2024 – Aug 2024</span><span class="open-icon" aria-hidden="true">↗</span></button>
<button class="work-item" type="button" data-entry="3" aria-haspopup="dialog"><img class="company-logo" src="images/epson/epson-mark.png" alt=""><span class="card-title" title="Epson Canada">Epson Canada</span><span class="card-date">Jan 2023 – Dec 2023</span><span class="open-icon" aria-hidden="true">↗</span></button></div>

<button class="work-item" type="button" data-entry="4" aria-haspopup="dialog"><img src="images/openvla/openvla-icon.svg?v=5" alt=""><span class="card-title" title="Zero-Shot VLA Manipulator Simulation Interface">OpenVLA Simulation</span><span class="card-date">Aug 2025 – Sep 2025</span><span class="open-icon" aria-hidden="true">↗</span></button>

<button class="work-item" type="button" data-entry="6" aria-haspopup="dialog"><img src="images/spacemapper/spacemapper-icon.svg?v=5" alt=""><span class="card-title" title="SLAM SpaceMapper Robot">SLAM SpaceMapper</span><span class="card-date">Jul 2024 – Aug 2024</span><span class="open-icon" aria-hidden="true">↗</span></button></div>

            <section aria-labelledby="academics-title">

                <div class="work-list"><button class="work-item" type="button" data-entry="1" aria-haspopup="dialog"><img class="company-logo" src="images/cl2/cl2logo.svg" alt=""><span class="card-title" title="CL2 Lab">CL2 Lab</span><span class="card-date">Sep 2024 – Present</span><span class="open-icon" aria-hidden="true">↗</span></button>
<button class="work-item" type="button" data-entry="8" aria-haspopup="dialog"><img class="company-logo ntu-logo" src="images/ntu/ntu-crest.png" alt=""><span class="card-title" title="Nanyang Technological University">NTU</span><span class="card-date">Aug 2025 – Dec 2025</span><span class="open-icon" aria-hidden="true">↗</span></button></div>

    </main>
    <dialog class="work-window" aria-labelledby="window-title">
        <div class="window-bar"><button class="close-window" type="button" aria-label="Close window">×</button></div>
        <div class="window-content">
            <div class="gallery-column">
                <div class="gallery-controls"><button class="motion-toggle" type="button" hidden>Pause GIFs</button></div>
                <div class="photo-gallery" aria-label="Photo gallery"></div>
            </div>
            <div class="window-copy">
                <h2 id="window-title"></h2>
                <p class="window-dates"></p>
                <p class="window-lead"></p>
                <p class="window-description"></p>
                <a class="window-code" href="#">View code ↗</a>
            </div>
        </div>
    </dialog>
    <dialog class="image-viewer" aria-label="Enlarged photo">
        <div class="viewer-bar">
            <button class="viewer-motion" type="button" hidden>Pause GIF</button>
            <button class="close-image close-window" type="button" aria-label="Close enlarged photo">×</button>
        </div>
        <figure><img class="enlarged-image" alt=""><figcaption class="image-caption"></figcaption></figure>
    </dialog>
    <script src="js/portfolio.js?v=18"></script>
